<style>
:root{--b0:#0B2E7A;--b1:#1D63D8;--b2:#2F8BFF;--bl:#E8F1FF;--o1:#E85D04;--o2:#FF9A3D;--g0:#0F7A45;--g1:#1FA85A;--gl:#E3F6EA;
--bg:#F6F9FF;--card:#fff;--ln:#E3E9F4;--tx:#0F1B33;--tx2:#5B6B85;--chip:#fff;--sh:0 4px 16px rgba(15,27,51,.08);--sh2:0 10px 28px rgba(15,27,51,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1424;--card:#142036;--ln:#243452;--tx:#EAF0FF;--tx2:#9FB0CC;--bl:#16305F;--gl:#103A27;--chip:#142036;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1424;--card:#142036;--ln:#243452;--tx:#EAF0FF;--tx2:#9FB0CC;--bl:#16305F;--gl:#103A27;--chip:#142036;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Plus Jakarta Sans',Inter,sans-serif;margin:0;line-height:1.2}a{color:var(--b1);text-decoration:none}button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--o2);outline-offset:2px}.w{max-width:1200px;margin:0 auto;padding:0 16px}.mut{color:var(--tx2)}
section.s{padding:32px 0}@media(min-width:1024px){section.s{padding:56px 0}}.narrow{max-width:760px;margin:0 auto}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(90deg,#0B2E7A 0%,#1D63D8 60%,#2F8BFF 100%);color:#fff}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0B2E7A;z-index:30}
nav .w{display:flex;align-items:center;height:64px;gap:12px}
.logo{font:800 20px 'Plus Jakarta Sans';color:#fff;display:flex;align-items:center;gap:8px}.logo svg{width:30px;height:30px}
.menu{display:none;gap:2px;margin-left:12px;flex:1}.mi{position:relative}
.mi>a,.mi>span{color:#fff;padding:21px 14px;display:block;font-weight:500;font-size:15px;cursor:pointer;transition:.2s}
.mi:hover>a,.mi:hover>span,.mi.on>a,.mi.on>span{background:linear-gradient(135deg,#1FA85A,#0F7A45)}
.dd{display:none;position:absolute;left:0;background:var(--card);border-radius:16px;box-shadow:var(--sh2);min-width:220px;padding:8px;color:var(--tx);z-index:25}
.mi .dd{top:64px}.rg{position:relative}.rg .dd{top:100%;right:0;left:auto}
.mi:hover .dd,.mi:focus-within .dd,.rg:hover .dd,.rg:focus-within .dd{display:block}
.dd a{display:block;padding:10px 14px;border-radius:10px;color:var(--tx);font-size:15px}.dd a:hover{background:var(--gl);color:var(--g0)}
.nr{display:none;align-items:center;gap:10px;margin-left:auto}
.av{width:40px;height:40px;border-radius:50%;border:2px solid #fff;background:linear-gradient(135deg,#34C77B,#0F7A45);color:#fff;font-weight:700}
.btn{border:0;border-radius:999px;padding:12px 22px;min-height:44px;font-weight:600;color:#fff;background:linear-gradient(135deg,#FF9A3D,#E85D04);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.2s}
.btn:hover{background:linear-gradient(135deg,#F28A25,#C94F00);transform:translateY(-2px);box-shadow:0 8px 18px rgba(232,93,4,.45)}.btn:active{transform:translateY(0) scale(.97);box-shadow:none}
.btn.sm{padding:8px 16px;min-height:40px;font-size:14px}.btn.gr{background:linear-gradient(135deg,#34C77B,#0F7A45)}.btn.gr:hover{background:linear-gradient(135deg,#27B56A,#0A5A33);box-shadow:0 8px 18px rgba(15,122,69,.45)}
.btn.out{background:var(--card);color:var(--b1);border:2px solid var(--b1)}.btn.out:hover{background:var(--bl);box-shadow:var(--sh)}.btn.wh{background:none;border:2px solid #fff;color:#fff}.btn.wh:hover{background:rgba(255,255,255,.18);box-shadow:none}
.burger{margin-left:auto;background:none;border:0;color:#fff;font-size:28px;min-width:44px;min-height:44px}
#ov{display:none;position:fixed;inset:0;background:rgba(5,12,30,.55);z-index:40}#ov.open{display:block}
#panel{position:fixed;top:0;right:0;bottom:0;width:clamp(240px,50vw,360px);background:var(--card);z-index:41;overflow:auto;padding:16px;transform:translateX(105%);transition:transform .25s;box-shadow:-8px 0 24px rgba(0,0,0,.25)}#panel.open{transform:none}
#panel details{border-bottom:1px solid var(--ln)}#panel summary,#panel>a.l{display:block;padding:14px 4px;font-weight:600;color:var(--tx);list-style:none}#panel details a{display:block;padding:10px 14px;color:var(--tx2)}#panel .btn{width:100%;margin-top:12px}
.px{background:none;border:0;font-size:24px;color:var(--tx);float:right;min-width:44px;min-height:44px}
@media(min-width:1024px){.menu{display:flex}.burger,#ov,#panel{display:none!important}.nr{display:flex}}
.bn{position:relative;overflow:hidden;color:#fff;height:200px}.bn.big{height:260px}
@media(min-width:640px){.bn{height:240px}.bn.big{height:320px}}@media(min-width:1024px){.bn{height:320px}.bn.big{height:420px}}
.sl{position:absolute;inset:0;opacity:0;transition:opacity .6s;display:flex;align-items:center;pointer-events:none}.sl.on{opacity:1;pointer-events:auto}
.sl::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(11,46,122,.88),rgba(29,99,216,.35))}.sl .ph{position:absolute;inset:0;z-index:-1}
.sl .w{position:relative;width:100%}.sl h2{font-size:26px;max-width:640px;font-weight:800}.sl p{margin:8px 0 16px;max-width:520px;font-size:15px}
@media(min-width:1024px){.sl h2{font-size:40px}.sl p{font-size:17px}}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:8px}.dots b{width:9px;height:9px;border-radius:9px;background:rgba(255,255,255,.5);cursor:pointer;transition:.3s}.dots b.on{background:#fff;width:24px}
.ar{display:none;position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.25);color:#fff;font-size:20px}.ar.l{left:12px}.ar.r{right:12px}@media(min-width:1024px){.ar{display:block}}
.ph1{background:linear-gradient(135deg,#1D63D8,#2F8BFF)}.ph2{background:linear-gradient(135deg,#0F7A45,#34C77B)}.ph3{background:linear-gradient(135deg,#E85D04,#FF9A3D)}.ph4{background:linear-gradient(135deg,#0B2E7A,#1D63D8)}
.grid{display:grid;gap:20px;grid-template-columns:1fr}@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}@media(min-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;transition:.25s;cursor:pointer}.card:hover{box-shadow:var(--sh2);transform:translateY(-3px)}
.poster{aspect-ratio:4/5;display:grid;place-items:center;font-size:56px;object-fit:cover}.im{aspect-ratio:4/3;display:grid;place-items:center;font-size:44px;position:relative}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}.cb h3{font-size:17px}.cb p{margin:0;color:var(--tx2);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.cb .btn{margin-top:auto;align-self:flex-start}
.dp{align-self:flex-start;border:1.5px solid var(--b1);background:var(--chip);color:var(--b1);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600;cursor:default}
.lb{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--bl);color:var(--b1);display:inline-block;margin:0 4px 4px 0}.lb.g{background:var(--gl);color:var(--g0)}.lb.o{background:#FFE9D6;color:#B24300}.lb.x{background:#e7eaf0;color:#5B6B85}
.spon{position:absolute;top:8px;right:8px;background:#0F1B33;color:#fff;font-size:11px;border-radius:6px;padding:2px 8px}.loc{font-size:13px;color:var(--tx2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}.chip{white-space:nowrap;border:1.5px solid var(--b1);background:var(--chip);color:var(--b1);border-radius:999px;padding:8px 16px;min-height:40px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;transition:.2s}.chip:hover{background:var(--bl)}.chip.on{background:var(--b1);color:#fff}
.h{margin-bottom:20px}.h h2,section h2{font-size:24px}@media(min-width:1024px){.h h2,section h2{font-size:30px}}.mid{display:flex;justify-content:center;margin-top:28px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:-28px;position:relative;z-index:2}.stats div{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:14px;text-align:center}.stats b{display:block;font:800 26px 'Plus Jakarta Sans';color:var(--b1)}.stats span{font-size:13px;color:var(--tx2)}
.cta{background:linear-gradient(135deg,#0B2E7A,#1D63D8 70%,#2F8BFF);color:#fff;border-radius:16px;box-shadow:var(--sh);padding:28px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;margin-bottom:20px}.cta.g{background:linear-gradient(135deg,#0A5A33,#1FA85A)}.cta h2{font-size:22px}.cta .ic{font-size:40px}.cta p{margin:0;max-width:640px}
@media(min-width:1024px){.cta{flex-direction:row;align-items:center;padding:32px 40px;gap:28px}.cta .ic{font-size:56px}.cta>div{flex:1}.cta h2{font-size:26px}}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:4px 0 20px}.bar select,input.in,select.in{border:1.5px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:9px 14px;font:inherit;font-size:14px;min-height:40px}.tgl{display:flex;align-items:center;gap:6px;font-size:14px;min-height:40px}
.empty{text-align:center;padding:40px 16px;color:var(--tx2);background:var(--card);border-radius:16px;box-shadow:var(--sh)}.empty h3{color:var(--tx);margin-bottom:6px}
.cal{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:16px;max-width:560px;margin:0 auto 24px}.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cg .dn{font-size:12px;color:var(--tx2);font-weight:600}
.cd{aspect-ratio:1;border:0;background:none;border-radius:12px;position:relative;color:var(--tx);font-size:14px;min-height:40px}.cd.z{opacity:.35;cursor:default}.cd:not(.z):hover{background:var(--bl)}.cd.sel{background:var(--b1);color:#fff}
.cd.td span{border:2px solid var(--o1);border-radius:50%;display:inline-grid;place-items:center;width:30px;height:30px}.cd i{position:absolute;top:2px;right:2px;background:var(--o1);color:#fff;font:700 10px/1 Inter;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;font-style:normal}
.cm{margin-bottom:36px}.cm>h3{text-align:center;margin-bottom:12px;color:var(--b1)}.dh{margin:22px 0 12px;color:var(--b1)}

'rute-lari':()=>{const l=rfilter(),r=st.r!=null?R[st.r]:null;let vb='0 0 460 300';if(r){const xs=r.pt.map(a=>a[0]),ys=r.pt.map(a=>a[1]),x0=Math.min(...xs)-40,y0=Math.min(...ys)-30,w=Math.max(...xs)-Math.min(...xs)+80,h=Math.max(...ys)-Math.min(...ys)+60,k=Math.max(w/460,h/300);vb=`${x0-(460*k-w)/2} ${y0-(300*k-h)/2} ${460*k} ${300*k}`}
return bn('rute')+`<div class="w"><section class="s"><h2 style="margin-bottom:12px">Rute Lari</h2><div class="bar">${sel('rd',['Semua jarak','3K','5K','10K','15K+'],st.rd)}${sel('rl',['Semua level','Pemula','Menengah','Lanjut'],st.rl)}</div>${chips(['Semua Area',...WIL.map(w=>w)],st.ra,'data-ra')}<div class="rl"><div class="lst">${l.map(x=>`<article class="card rc2 ${R[st.r]===x?'sel':''}" data-r="${R.indexOf(x)}"><div class="cb" style="padding:0"><h3>🛣️ ${x.n}</h3><span class="loc">${x.ar} · Kec. ${x.kc}</span><div>${lbl(x.km+' km')}${lbl(x.lv,'g')}${lbl('±'+x.d1+'–'+x.d2+' menit','x')}</div><span class="loc">${x.s} → ${x.e}</span><p>${x.ds}</p></div></article>`).join('')||'<div class="empty">Belum ada rute yang cocok.</div>'}</div><div class="map"><svg viewBox="${vb}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Peta rute">${BASE}${r?`<polyline points="${r.pt.map(a=>a.join(',')).join(' ')}" fill="none" stroke="#1D63D8" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${r.pt[0][0]}" cy="${r.pt[0][1]}" r="7" fill="#1FA85A" stroke="#fff" stroke-width="3"/>${r.tp2=='Satu arah'?`<circle cx="${r.pt[r.pt.length-1][0]}" cy="${r.pt[r.pt.length-1][1]}" r="7" fill="#D93025" stroke="#fff" stroke-width="3"/>`:''}`:''}</svg></div></div>${r?`<div class="box dc"><h2 style="font-size:22px">${r.n}</h2><div style="margin:6px 0">${lbl(r.km+' km')}${lbl(r.lv,'g')}${lbl('±'+r.d1+'–'+r.d2+' menit','x')}</div><div class="row"><b>Jenis rute</b>${r.tp2}</div><div class="row"><b>Dari – ke</b>Dari ${r.s} ${r.tp2=='Satu arah'?'ke':'kembali ke'} ${r.e}</div><div class="row"><b>Kondisi jalur</b>${r.kd}</div><div class="row"><b>Cocok untuk</b>${r.cc}</div><div class="row"><b>Tips</b>${r.tp}</div><div class="row"><b>Catatan</b>${r.ct}</div><a class="btn sm" style="margin-top:12px" target="_blank" rel="noopener" href="https://maps.google.com">Petunjuk Arah ke Titik Mulai</a></div>`:'<p class="mut">Pilih rute untuk melihat garis di peta dan deskripsinya.</ vendor:()=>vend(),'vendor-perlengkapan':()=>vend(),'vendor-race':()=>vend(),'vendor-medali':()=>vend(),'vendor-jersey':()=>vend(),'vendor-fotografer':()=>vend(),
blog:()=>bn('blog')+`<div class="w"><section class="s"><h2 style="margin-bottom:12px">Blog</h2>${chips(['Semua','Panduan','Tips','Cerita'],st.bc,'data-bc')}<div class="grid">${B.map((b,i)=>[b,i]).filter(x=>st.bc=='Semua'||x[0][1]==st.bc).map(x=>bcard(x[0],x[1])).join('')}</div></section></div>`,
'blog-detail':()=>{const b=B[st.bg];return `<div class="wb"><div class="bc"><a href="#beranda">Beranda</a> / <a href="#blog">Blog</a> / ${b[0]}</div><div class="hero ${TC[(st.bg+1)%4]}" role="img" aria-label="Gambar utama">📰</div><article class="art"><div>${lbl(b[1],'g')}<span class="loc">${ds(new Date(b[2]+'T06:00'))} · ${b[3]} menit baca</span></div><h1>${b[0]}</h1><p>Mulailah dari jarak pendek, jaga pace yang masih nyaman untuk ngobrol, dan beri tubuh waktu istirahat. Tambah jarak sedikit demi sedikit setiap minggu.</p><div class="ph ph1" role="img" aria-label="Gambar dalam artikel">🖼️</div><p>Konsistensi lebih penting daripada kecepatan. Cari teman latihan atau komunitas supaya lebih semangat dan aman.</p><button class="btn bl" data-share>${IC.sh} Bagikan</button></article><section class="s"><h2 style="margin-bottom:16px">Artikel terkait</h2><div class="grid">${B.map((x,i)=>[x,i]).filter(x=>x[1]!=st.bg).slice(0,3).map(x=>bcard(x[0],x[1])).join('')}</div></section></div>`},
tentang:()=>ph('Tentang Run Connect')+`<div class="w"><section class="s narrow"><p style="font-size:18px">Run Connect mengumpulkan event lari, profil komunitas, jadwal latihan, tempat lari, dan rute lari di Surabaya dalam satu tempat, supaya mencari kegiatan lari terasa mudah.</p>${[['Mengapa kami ada','Informasi lari sering tersebar di media sosial dan grup percakapan. Kami melihat tiga hal yang berulang: sulit menemukan info di satu tempat, sulit menemukan komunitas dan teman lari yang cocok, dan sulit menemukan tempat lari yang nyaman.'],['Apa yang bisa kamu temukan','Kalender event lari, direktori komunitas, peta tempat lari, rute lari, serta vendor dan perlengkapan lari.'],['Cara kami menyusun data','Data berasal dari penyelenggara, komunitas, dan pelari, lalu diperiksa tim sebelum ditayangkan. Kalau ada informasi yang keliru, mitra bisa melaporkan koreksi lewat halaman Submission.'],['Tentang proyek ini','Run Connect dikembangkan oleh mahasiswa Sistem Informasi ITS sebagai bagian dari pembelajaran Design Thinking, berangkat dari wawancara langsung dengan pelari dan pendiri komunitas.']].map(x=>`<h2 style="margin:28px 0 8px;font-size:22px">${x[0]}</h2><p>${x[1]}</p>`).join('')}<h2 style="margin:28px 0 8px;font-size:22px">Tujuan kami</h2><ol class="mv"><li>Memusatkan informasi event, komunitas, dan tempat lari dalam satu platform.</li><li>Memudahkan pelari pemula menemukan jadwal, komunitas, dan teman latihan.</li><li>Menyediakan informasi lokasi dan rute lari yang nyaman di Surabaya.</li><li>Membantu penyelenggara, komunitas, dan pelaku usaha lari lokal lebih mudah ditemukan.</li></ol><h2 style="margin:28px 0 8px;font-size:22px">Visi (draf)</h2><p>Menjadi wadah informasi lari yang lengkap dan tepercaya di Surabaya, yang menghubungkan pelari, komunitas, penyelenggara, dan pelaku usaha lari lokal.</p><h2 style="margin:28px 0 8px;font-size:22px">Misi (draf)</h2><ul class="mv"><li>Memusatkan informasi kegiatan lari.</li><li>Mempermudah pelari menemukan jadwal latihan dan event.</li><li>Membantu pelari pemula menemukan komunitas yang sesuai.</li><li>Menyediakan informasi lokasi dan rekomendasi rute lari.</li><li>Membangun keterhubungan antar pelari dan komunitas di Surabaya.</li></ul><h2 style="margin:28px 0 12px;font-size:22px">Tim Pengembang</h2><div class="team">${TEAM.map((n,i)=>`<div class="box"><i style="background:${TCOL[i]}">${n.split(' ').slice(0,2).map(w=>w[0]).join('')}</i><b>${n}</b></div>`).join('')}</div><h2 style="margin:28px 0 12px;font-size:22px">Hubungi Kami</h2><div class="sbr">${sbtn('ig','Instagram @runconnect')}${sbtn('wa')}${sbtn('ml','Email tim')}</div><div class="cta" style="margin-top:28px"><div><h2>Untuk penyelenggara, komunitas, dan vendor</h2><p>Daftarkan kegiatanmu, gratis untuk saat ini.</p></div><a class="btn" href="#daftar-event">Daftarkan sekarang</a></div></section></div>`,
masuk:()=>ph('Masuk')+`<div class="w"><section class="s narrow"><h2 style="margin-bottom:6px">1. Pilih peran</h2><p class="mut" style="margin-top:0">Satu akun Google bisa dipakai untuk kedua peran. Peran dipilih setiap kali masuk.</p><div class="rolec"><button class="role ${st.pick=='mitra'?'on':''}" data-role="mitra"><span class="ic">🏢</span><h3>Sebagai Mitra</h3><span class="mut">Penyelenggara event, komunitas, vendor</span></button><button class="role ${st.pick=='lari'?'on':''}" data-role="lari"><span class="ic">🏃‍♂️</span><h3>Sebagai Pengguna Lari</h3><span class="mut">Simpan event dan kirim lokasi lari</span></button></div>${st.pick?`<div class="box lc" style="margin-top:20px"><h2 style="font-size:20px">2. Masuk sebagai ${RN[st.pick]}</h2><button class="btn gg" data-gl>${GG}Masuk dengan Google</button></div>`:''}</section></div>`,

function vend(){const c=VC[rt()]||'Semua',pf=c=='Perlengkapan Lari';return bn('vendor')+`<div class="w"><section class="s"><h2 style="margin-bottom:12px">Vendor & Gear</h2>${chips(Object.values(VC),c,'data-v')}${pf?chips(VJ,st.vj,'data-vj'):''}<div class="grid">${V.filter(v=>(c=='Semua'||v[2]==c)&&(!pf||st.vj=='Semua jenis'||v[3]==st.vj)).map(vcard).join('')}</div></section></div>`}

const acc=st.user?`<div class="rg"><button class="acb" data-dd aria-haspopup="true"><span class="av" style="display:grid;place-items:center">${ini()}</span><span class="n">${st.user.name}</span> ▾</button><div class="dd" style="min-width:260px">${prof()}${AM().map(x=>`<a href="${x[2]}">${x[0]} ${x[1]}</a>`).join('')}<a class="lo" href="#beranda" data-out>${IC.lo} Keluar</a></div></div>`:'<a class="btn sm wh" href="#masuk">Masuk</a>';

function ftr(){$('#ft').innerHTML=`<div class="w"><div><h3>Run Connect</h3><p style="font-size:14px;margin:0">Event, komunitas, tempat lari, dan rute lari di Surabaya dalam satu tempat.</p></div><div><h3>Menu cepat</h3><a href="#event">Semua Event</a><a href="#komunitas">Komunitas</a><a href="#tempat-lari">Tempat Lari</a><a href="#rute-lari">Rute Lari</a><a href="#blog">Blog</a></div><div><h3>Daftarkan</h3>${Object.keys(FT).map(k=>`<a href="#daftar-${k}">${FT[k]}</a>`).join('')}</div><div><h3>Kontak</h3><div class="sbr" style="margin:0"><button class="sbt ig" data-toast="Akun resmi diisi sebelum tayang">${IC.ig}Instagram</button><button class="sbt wa" data-toast="Akun resmi diisi sebelum tayang">${IC.wa}WhatsApp</button><button class="sbt ot" data-toast="Email resmi diisi sebelum tayang">${IC.ml}Email</button></div></div><div class="cp">© 2026 Run Connect · Proyek mahasiswa Sistem Informasi ITS</div></div>`}
function toast(m,h){const t=document.createElement('div');t.className='toast';if(h)t.innerHTML=m;else t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),h?4500:2200)}
function carousel(){document.querySelectorAll('[data-bn]').forEach(b=>{const s=[...b.querySelectorAll('.sl')],d=[...b.querySelectorAll('.dots b')];let i=0,p=false,x0=0;const to=n=>{i=(n+s.length)%s.length;s.forEach((x,k)=>x.classList.toggle('on',k==i));d.forEach((x,k)=>x.classList.toggle('on',k==i))};b.querySelector('.l').onclick=()=>to(i-1);b.querySelector('.r').onclick=()=>to(i+1);d.forEach((x,k)=>x.onclick=()=>to(k));b.onmouseenter=()=>p=true;b.onmouseleave=()=>p=false;b.addEventListener('touchstart',e=>{p=true;x0=e.touches[0].clientX},{passive:true});b.addEventListener('touchend',e=>{p=false;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)to(i+(dx<0?1:-1))});const t=setInterval(()=>{if(!document.body.contains(b))return clearInterval(t);if(!p)to(i+1)},6000)})}
function go(keep){let h=rt();if(!P_[h])h='beranda';const y=scrollY;$('#app').innerHTML=P_[h]();pnl(0);carousel();scrollTo(0,keep?y:0)}
const app=$('#app');
app.addEventListener('click',e=>{const t=e.target.closest('[data-j],[data-d],[data-cn],[data-v],[data-vj],[data-bc],[data-faq],[data-tab],[data-role],[data-gl],[data-switch],[data-submit],[data-ladd],[data-sadd],[data-rm],[data-mc],[data-pk],[data-pi],.pin,[data-px],[data-kc],[data-sb],[data-sg],[data-r],[data-ra],[data-pa],[data-rreset],[data-bm],[data-share],.up,[data-reset],[data-toast]');if(!t)return;const D=t.dataset;
if(D.j!=null){st.j=D.j;go(1)}else if(D.d!=null){if(t.classList.contains('z'))return;st.sel[D.k]=st.sel[D.k]==+D.d?null:+D.d;go(1)}
else if(D.cn!=null){st.cm[D.y]+= +D.cn;st.sel={};go(1)}
else if(D.v!=null){location.hash=Object.keys(VC).find(k=>VC[k]==D.v)}else if(D.vj!=null){st.vj=D.vj;go(1)}else if(D.bc!=null){st.bc=D.bc;go(1)}else if(D.faq!=null){st.faq=st.faq==+D.faq?-1:+D.faq;go(1)}else if(D.tab!=null){st.tab=D.tab;go(1)}
else if(D.role!=null){st.pick=D.role;go(1)}
else if(D.gl!=null){st.user={role:st.pick,name:'Darren Pratama',email:'darren@contoh.id'};nav();const r=ret&&!['beranda','masuk'].includes(ret)?ret:(st.pick=='mitra'?'mitra':'akun-disimpan');location.hash='#'+r}
else if(D.switch!=null){const need=ROLE[rt().replace('daftar-','')]||(rt()=='saran'?'lari':'mitra');st.user=null;st.pick=need;nav();location.hash='#masuk'}
else if(D.submit!=null){let ok=1;t.closest('.box').querySelectorAll('.fg').forEach(g=>{const b=bad(g);const er=g.querySelector('.err');if(er)er.style.display=b?'block':'none';if(b)ok=0});if(ok){st.sent=1;go()}else toast('Lengkapi kolom yang wajib diisi')}
else if(D.ladd!=null){const i=t.previousElementSibling;if(i.value.trim()){t.closest('.ls').querySelector('.bl').insertAdjacentHTML('beforeend',`<li><span contenteditable="true">${i.value.trim()}</span><button type="button" data-rm aria-label="Hapus">✕</button></li>`);i.value=''}}
else if(D.sadd!=null){const ins=t.closest('.ls').querySelectorAll('.two input');if(ins[0].value.trim()&&ins[1].value.trim()){t.closest('.ls').querySelector('.bl').insertAdjacentHTML('beforeend',`<li><span contenteditable="true">${ins[0].value.trim()}: ${ins[1].value.trim()}</span><button type="button" data-rm aria-label="Hapus">✕</button></li>`);ins[0].value=ins[1].value=''}}
else if(D.rm!=null)t.closest('li').remove();else if(D.mc!=null)t.classList.toggle('on');
else if(D.pk!=null){t.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x==t));t.closest('.fg').querySelector('.pkx').style.display=t.textContent=='Berbayar'?'grid':'none'}
else if(t.matches('.up'))t.classList.add('ok');
else if(D.pi!=null){st.p=+D.pi;st.zoom=1;go(1)}else if(t.matches('.pin')){st.p=+D.p;st.zoom=1;go(1)}else if(D.px!=null){st.p=null;st.zoom=0;go(1)}else if(D.kc!=null){st.kc=D.kc;go(1)}else if(D.sb!=null){st.sb=!(st.sb===undefined?innerWidth>=1024:st.sb);go(1)}
else if(D.sg!=null){if(st.user&&st.user.role=='lari')nv('saran','sp',+D.sg);else needLari()}
else if(D.pa!=null){st.pa=D.pa;go(1)}else if(D.r!=null){st.r=+D.r;go(1)}else if(D.ra!=null){st.ra=D.ra;st.r=null;go(1)}else if(D.rreset!=null){Object.assign(st,{rd:'Semua jarak',rl:'Semua level',ra:'Semua Area',r:null});go(1)}
else if(D.bm!=null){if(st.user&&st.user.role=='lari'){const i=+D.bm;st.saved.has(i)?st.saved.delete(i):st.saved.add(i);go(1);toast(st.saved.has(i)?'Event disimpan':'Dihapus dari Disimpan')}else needLari()}
else if(D.share!=null){try{navigator.clipboard.writeText(location.href).catch(()=>{})}catch(x){}toast('Tautan disalin')}
else if(D.reset!=null){Object.assign(st,{j:'Semua',free:0,open:0,loc:'Semua lokasi',dist:'Semua jarak',area:'Semua area',q:''});go(1)}else if(D.toast!=null)toast(D.toast)});
app.addEventListener('change',e=>{const t=e.target;if(t.dataset.cb){st[t.dataset.cb]=t.checked?1:0;go(1)}else if(t.dataset.s){st[t.dataset.s]=t.value;go(1)}else if(t.hasAttribute('data-kv')){const j=t.closest('.box').querySelector('.jen');if(j)j.style.display=t.value=='Perlengkapan Lari'?'block':'none'}else if(t.classList.contains('fl2')){t.closest('.fx').querySelectorAll('input:not(.fl2),select').forEach(i=>i.disabled=t.checked)}});
app.addEventListener('input',e=>{const t=e.target;if(t.dataset.q!=null){st.q=t.value;$('#kg').innerHTML=kgrid()}else if(t.id=='ps')$('#pl').innerHTML=plist(t.value)});
addEventListener('hashchange',()=>{const r=rt();if(r=='masuk')ret=prevR;else prevR=r;st.sent=0;st.sel={};if(r!='tempat-lari'){st.p=null;st.zoom=0}nav();go()});
function endSp(){const s=$('#sp');if(!s)return;s.classList.add('out');setTimeout(()=>s.remove(),700)}
try{if(sessionStorage.getItem('rc-sp'))$('#sp').remove();else{sessionStorage.setItem('rc-sp','1');setTimeout(endSp,5000)}}catch(x){setTimeout(endSp,5000)}
ftr();nav();go();

</script></body></html>
